# Include inside the TLS server block for abhijitmohanty.com.
location = /openquest { return 301 /openquest/; }

# Preserve historic root-path bookmarks without taking over the main site.
location ~ ^/(discover|campaigns)(/|$) {
    return 302 /openquest$request_uri;
}

location /openquest/api/ {
    proxy_pass http://127.0.0.1:8788/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sandboxed discovery and verification can take longer than a normal API
    # request; keep the browser connection aligned with the agent deadline.
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
}

location /openquest/trueforge/ {
    # Hosted TrueForge binds privately on the VPS; it replaces the retired
    # standalone instance that used port 8790.
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
}

location /openquest/ {
    alias /srv/openquest/current/dist/;
    add_header Cache-Control "public, max-age=60, s-maxage=300" always;
    try_files $uri $uri/ /openquest/index.html;
}
